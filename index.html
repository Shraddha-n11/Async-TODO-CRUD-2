
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
    
    <title>Employee Management System</title>

    </head>

<body>

    <header>
        <div class="newHead">
            <h2 class="text-center">Employee Management</h2>
            <p class="text-center">Manage Your Tasks Efficiently!</p>
        </div>
    </header>

    <div class="container mt-4 mb-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow my-card">
                    <div class="card-header headings text-white">
                        <h4 class="text-center mb-0">Add Employee Task</h4>
                    </div>
                    <div class="card-body">
                        <form id="form">
                            <div class="form-group">
                                <label for="Employee">Employee Name</label>
                                <input type="text"
                                    class="form-control"
                                    id="Employee"
                                    placeholder="Enter employee name"
                                    required>
                            </div>
                            <div class="form-group">
                                <label for="Task">Task Name</label>
                                <input type="text"
                                    class="form-control"
                                    id="Task"
                                    placeholder="Enter task name"
                                    required>
                            </div>
                            <button type="submit"
                                class="btn btn-dark btn-block"
                                id="submitBtn">
                                <i class="fa-solid fa-plus mr-2"></i>
                                Add Task
                            </button>
                            <button type="button"
                                class="btn btn-success btn-block d-none"
                                id="updateBtn">
                                <i class="fa-solid fa-pen-to-square mr-2"></i>
                                Update Task
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card shadow my-card">
                    <div class="card-header headings">
                        <h4 class="text-center mb-0">
                            <i class="fa-solid fa-list-check mr-2"></i>
                            Employee Task List
                        </h4>
                    </div>
                    <div class="card-body">
                        <ul class="list-group" id="list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
